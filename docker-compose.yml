services:
  db:
    image: postgres:17-alpine
    container_name: ijunior-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ijunior
      POSTGRES_PASSWORD: ijunior
      POSTGRES_DB: ijunior_erp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ijunior -d ijunior_erp']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
